services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deployguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deployguard
      POSTGRES_PASSWORD: deployguard_password
      POSTGRES_DB: deployguard
    ports:
      - "5432:5432"
    volumes:
      - deployguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployguard -d deployguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deployguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - deployguard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  deployguard_postgres_data:
  deployguard_redis_data: